[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgkit"
version = "1.0.0"
description = "Claude Knowledge Graph Engineering Kit for Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "anthropic>=0.100",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
kgkit = "kgkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
